# Décompresse automatiquement le zip du projet envoyé par le navigateur, puis le supprime.
# À effacer une fois le projet en place.
name: Décompresser le projet

on:
  push:
    paths:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decompresser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Décompresser le zip à la racine du dépôt
        run: |
          set -e
          ZIP=$(ls VocalPDF*.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$ZIP" ]; then echo "Aucun zip VocalPDF trouvé."; exit 0; fi
          rm -rf /tmp/projet && mkdir /tmp/projet
          unzip -q -o "$ZIP" -d /tmp/projet
          # Le zip contient un dossier VocalPDF/ : on copie son contenu à la racine
          if [ -d /tmp/projet/VocalPDF ]; then SRC=/tmp/projet/VocalPDF; else SRC=/tmp/projet; fi
          cp -a "$SRC"/. .
          git rm -q "$ZIP"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "VocalPDF 1.1.0"
          git push origin "HEAD:${GITHUB_REF_NAME}"
